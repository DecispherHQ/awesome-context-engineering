name: Check links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC: catch links that rot between edits.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,201,202,203,204,206,301,302,307,308,403,429
            --exclude-path vendor
            './**/*.md'
          fail: true
